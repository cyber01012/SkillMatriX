spring.application.name=skillanalyzer

# Activate local profile to load application-local.properties (which contains secrets)
# You can also set this via env var: SPRING_PROFILES_ACTIVE=local
spring.profiles.active=local

# ===== Gemini API =====
gemini.api-key.skill-extraction=${gemini.api-key.skill-extraction}
gemini.api-key.roadmap=${gemini.api-key.roadmap}
gemini.api-key=${gemini.api-key}

# ===== Adzuna API =====
adzuna.app-id=${adzuna.app-id}
adzuna.api-key=${adzuna.api-key}

# =======================
# MySQL datasource
# =======================
spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT with Hibernate 6/7:
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Optional (driver can be auto-detected)
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================
# File storage base path
# =======================
storage.base-path=${storage.base-path}
